[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-initsub"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-initsub = "osh_initsub"

[tool.setuptools]
package-dir = { "osh_initsub" = "." }
packages = ["osh_initsub"]

[tool.setuptools.package-data]
osh_initsub = ["pyproject.toml"]

[tool.osh.group_commands.init]
sub = "Sub of init."
