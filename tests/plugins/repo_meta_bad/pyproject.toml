[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-meta-bad"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-orphan = "osh_orphan"

[tool.setuptools]
packages = ["osh_orphan"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
