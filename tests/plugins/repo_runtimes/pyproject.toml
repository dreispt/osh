[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-runtimes"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-runtime-a = "osh_runtime_a"
osh-runtime-b = "osh_runtime_b"

[tool.setuptools]
packages = ["osh_runtime_a", "osh_runtime_b"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
