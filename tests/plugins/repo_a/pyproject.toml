[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-a"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-one = "osh_one"
osh-two = "osh_two"

[tool.setuptools]
packages = ["osh_one", "osh_two"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
