[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-derived"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-derived = "osh_derived"

[tool.setuptools]
package-dir = { "osh_derived" = "." }
packages = ["osh_derived"]

[tool.setuptools.package-data]
osh_derived = ["pyproject.toml"]

[tool.osh]

[tool.osh.group_commands]
db = { smart_list = "Smart listing." }
