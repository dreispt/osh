[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-marked"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-marked = "osh_marked"

[tool.setuptools]
packages = ["osh_marked"]

[tool.osh.commands]
marked = "A marked command."
