[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-min"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-future = "osh_future"
osh-okmin = "osh_okmin"

[tool.setuptools]
packages = ["osh_future", "osh_okmin"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
