[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-dep-missing"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-needy = "osh_needy"

[tool.setuptools]
packages = ["osh_needy"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
