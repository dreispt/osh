[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-scan"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-scan = "osh_scan"

[tool.setuptools]
package-dir = { "osh_scan" = "." }
packages = ["osh_scan"]

[tool.setuptools.package-data]
osh_scan = ["pyproject.toml"]
[tool.osh.commands]
scan = "Scan things."
