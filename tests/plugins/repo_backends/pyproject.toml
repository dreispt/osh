[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-backends"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-backend-a = "osh_backend_a"
osh-backend-b = "osh_backend_b"

[tool.setuptools]
packages = ["osh_backend_a", "osh_backend_b"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
