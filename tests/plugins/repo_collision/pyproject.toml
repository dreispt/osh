[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-collision"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
first = "osh_first"
second = "osh_second"

[tool.setuptools]
packages = ["osh_first", "osh_second"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
