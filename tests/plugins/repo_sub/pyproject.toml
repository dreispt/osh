[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-sub"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-subext = "osh_subext"
osh-unrelated = "osh_unrelated"

[tool.setuptools]
packages = ["osh_subext", "osh_unrelated"]

[tool.setuptools.package-data]
"*" = ["pyproject.toml"]
