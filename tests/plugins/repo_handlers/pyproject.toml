[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-helper"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-helper = "osh_helper"

[tool.setuptools]
package-dir = { "osh_helper" = "." }
packages = ["osh_helper"]

[tool.setuptools.package-data]
osh_helper = ["pyproject.toml"]

[tool.osh]
handlers = ["_util.fmt"]
