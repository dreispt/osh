[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osh-runtimex"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."osh.plugins"]
osh-runtimex = "osh_runtimex"

[tool.setuptools]
package-dir = { "osh_runtimex" = "." }
packages = ["osh_runtimex"]

[tool.setuptools.package-data]
osh_runtimex = ["pyproject.toml"]

[tool.osh]
extends = ["runtime"]
