description = "Download, cache and restore Odoo database backups. Deprecated: use 'osh db backup'/'osh db restore' instead."

[group_commands.db]
backup = "Download or dump a backup source (default: the current database)."
restore = "Restore a backup and neutralize it."
backups = "List cached backups."
remote = { group = true, help = "Manage named backup sources." }

# Deprecated spellings — hidden aliases that warn on use.
[group_commands.backup]
get = { help = "Deprecated: use 'osh db backup'.", hidden = true }
restore = { help = "Deprecated: use 'osh db restore'.", hidden = true }
list = { help = "Deprecated: use 'osh db backups'.", hidden = true }
remote = { group = true, help = "Deprecated: use 'osh db remote'.", hidden = true }

[sources]
db = "Dump a local PostgreSQL database using pg_dump."
http = "Download a backup from an Odoo /web/database/backup endpoint over HTTP."
https = "Download a backup from an Odoo /web/database/backup endpoint over HTTPS."
odoosh = "Fetch the latest daily backup from an Odoo.sh container over SSH."
ssh = "Copy an existing backup file from a remote host via SCP."
