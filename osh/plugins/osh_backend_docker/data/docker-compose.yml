services:
  odoo:
    # __BUILD__
    image: __IMAGE__
    # The container idles; commands are run via `docker compose exec`
    # (e.g. `osh odoo`, `osh shell`), so the stack is reused across commands.
    command: ["sleep", "infinity"]
    depends_on:
      - db
    ports:
      - "__PORT__:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: myodoo
      PORT: 5432
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: myodoo
      PGPORT: 5432
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ..:/mnt/extra-addons
    user: odoo
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: myodoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

volumes:
  odoo-web-data:
  odoo-db-data:
