[project]
name = "osh"
version = "0.2.6"
description = "Odoo Shell command-line interface"
authors = [
    {name = "Odoo Community Association", email="info@odoo-community.org"}
]
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
keywords = ["odoo", "cli", "shell", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    'tomli>=1.2.0; python_version<"3.11"',
    # Uncomment the following line when you are ready to connect to an actual server
    # "odoorpc>=0.12",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
]

[project.scripts]
osh = "osh.cli:main"

[project.urls]
Homepage = "https://github.com/dreispt/osh"
Source = "https://github.com/dreispt/osh"

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
osh = ["plugins/osh_backend_docker/data/*.yml", "data/*.sql"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = ["E501"]  # line length handled by black
